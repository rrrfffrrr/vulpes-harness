name: planning
version: 1
description: "KAOS goal-oriented planning (semi-formal) under a BABOK structure. Raw business requirements drive four KAOS models (goal, object, agent/responsibility, operation); the requirements document is the single sanctioned synthesis of those models; a separate traceability matrix links everything. No implementation/apply step."
# Authoring principles (all artifacts):
#  - Cover every distinct, relevant item exhaustively. Detail = breadth/depth of distinct
#    content, NOT word count.
#  - State each fact once. Within the four KAOS models (goal/object/responsibility/operation)
#    a fact appears in exactly one model. The requirements-document is the ONE sanctioned
#    aggregation and restates model content — it is exempt from the no-repetition rule.
#    No other repetition, anywhere.
#  - No meta/filler, no process commentary, no change-history (Git records change).
#  - No cross-references between artifacts in prose; linking is the traceability matrix's job.
#  - Semi-formal: natural language + structure (AND/OR, KAOS goal patterns, pre/post/trigger).
#    No temporal-logic formalization.
#  - Prose is plain and direct. Parentheses are only for a value/identifier/abbreviation
#    a term needs (kind=entity, < 640px, Owner/Admin/Member) or structural markers
#    (AND/OR). Do NOT defer essential content into parentheses or pile up bilingual
#    glosses — if it matters, it is part of the sentence; define a term's gloss once
#    (in the glossary) and use one form thereafter.
artifacts:
  - id: business-requirements
    generates: business-requirements.md
    description: >-
      Raw business requirements — the stakeholder's own statements, preserved verbatim.
      The single source of truth all models derive from.
    template: business-requirements.md
    instruction: |
      Preserve the stakeholder's stated business requirements VERBATIM, including any
      accompanying decisions/clarifications. Quote exact wording; do NOT paraphrase,
      summarize, reorder, or drop detail. Group by topic only for readability.
      Classify each as [Goal] (something the system should achieve) or [Constraint]
      (a fixed choice such as a tech-stack or policy decision).
      No analysis or design here — just the raw statements and their kind.
      If two statements conflict, keep BOTH verbatim and mark them as a conflict to be
      resolved in the goal model (do not resolve it here).
    requires: []

  - id: goal-model
    generates: goal-model.md
    description: >-
      KAOS goal model — goals refined top-down via AND/OR into leaf goals
      (requirements assigned to the software, expectations assigned to the environment),
      with domain properties and obstacles. Semi-formal (no temporal logic).
    template: goal-model.md
    instruction: |
      Build the KAOS goal model from the GOAL-bearing business requirements. One or more
      top-level business goals (no synthetic super-root); refine downward via
      AND-refinement (all subgoals needed) / OR-refinement (alternatives) to leaf level.
      Goal IDs encode the refinement kind: a dotted-number suffix (G1.2) marks an
      AND-refined subgoal; a trailing letter (G1.2.a) marks an OR-refined alternative.
      Phrase every goal with a KAOS pattern keyword — Achieve / Maintain / Avoid / Cease —
      so goals stay goals, not feature bullets.
      Each leaf is a REQUIREMENT (responsibility of the software-to-be) or an EXPECTATION
      (responsibility of an environment agent). Having zero expectations is acceptable for
      a software-only system — do not invent them.
      Record DOMAIN PROPERTIES — descriptive facts about the environment assumed true
      regardless of the system (not things the system enforces; those are requirements or
      object-model invariants). Record OBSTACLES
      (conditions that violate a goal); for each obstacle name a resolution and its kind
      from: prevent, reduce, mitigate, restore, weaken-goal, substitute-agent.
      If business requirements conflicted, resolve the conflict here and state the chosen rule.
      Do NOT name specific agents (responsibility model's job) or operations (operation
      model's job); referencing object names is fine, object structure is not.
    requires:
      - business-requirements

  - id: object-model
    generates: object-model.md
    description: >-
      KAOS object model — the entities, relationships, and attributes referenced by goals,
      plus a glossary. Conceptual/requirements-level (what exists and its rules), not
      solution design or a database schema.
    template: object-model.md
    instruction: |
      Build the KAOS object model: every entity named in any goal, domain property,
      obstacle, or expectation; their attributes (with meaning); their relationships
      (with cardinality); invariants; and a glossary of domain terms.
      Cardinality lives only in Relationships. Invariants cover only rules NOT expressible
      as a cardinality (e.g., uniqueness, conditional rules). This is conceptual /
      requirements-level — what exists and its rules — not solution design or code.
    requires:
      - business-requirements
      - goal-model

  - id: responsibility-model
    generates: responsibility-model.md
    description: >-
      KAOS agent/responsibility model — which agent (software component or environment
      actor) is responsible for each leaf goal (requirement/expectation).
    template: responsibility-model.md
    instruction: |
      Assign each leaf goal to a responsible AGENT. Software agents take REQUIREMENTS;
      environment agents take EXPECTATIONS. State each agent and the leaf goals it owns;
      every leaf goal must be owned by exactly one agent (no orphans).
      Responsibility means the agent must restrict its behavior to satisfy those goals.
    requires:
      - goal-model

  - id: operation-model
    generates: operation-model.md
    description: >-
      KAOS operation model — leaf goals operationalized into operations with
      pre/post/trigger conditions, and scenarios that exercise them.
    template: operation-model.md
    instruction: |
      Operationalize leaf goals into OPERATIONS, each with pre-condition, post-condition,
      and trigger (semi-formal natural language, no temporal logic). Do NOT restate which
      agent owns the operation — agent ownership lives in the responsibility model and is
      joined via the traceability matrix. Coverage: at least one nominal scenario per
      operation, plus one scenario per resolved obstacle whose resolution adds runtime
      behavior; for resolutions that change a goal rather than add behavior (weaken-goal,
      substitute-agent out of the software), note that no scenario applies instead of
      inventing one. Scenarios use Given/When/Then; reference the satisfied goal by name
      in the Then outcome without restating its definition.
    requires:
      - goal-model
      - object-model
      - responsibility-model

  - id: requirements-document
    generates: requirements-document.md
    description: >-
      The KAOS synthesized requirements document — the single final planning artifact.
      Consolidates the four models top-to-bottom: scope, business/strategic goals down to
      requirements, glossary, responsibilities, behavior.
    template: requirements-document.md
    instruction: |
      Consolidate the four models into one coherent, self-contained document, ordered top
      (scope and business/strategic goals) to bottom (requirements). Sections: Scope; Goals
      (goal specification); Glossary; Responsibilities; Behavior. Scope is NOT copied from a
      model — synthesize it from the top-level goals and the requirement-vs-expectation
      (software-vs-environment) split: what the system does (in) and what is left to the
      environment or deferred (out). The other four sections restate model content; this is
      the ONE sanctioned aggregation, exempt from the no-repetition rule. Self-contained,
      reads as current truth — no cross-references, no change-history.
    requires:
      - goal-model
      - object-model
      - responsibility-model
      - operation-model

  - id: traceability
    generates: traceability.md
    description: >-
      BABOK requirements traceability matrix (RTM) — a separate artifact linking
      business requirements ↔ goals ↔ leaf requirements/expectations ↔ agents ↔ operations.
    template: traceability.md
    instruction: |
      Produce a bidirectional traceability matrix linking: raw business requirements ↔
      goals ↔ leaf requirements/expectations ↔ responsible agents ↔ operations. Draw the
      ids and edges from the models (business-requirements, goal, responsibility, operation),
      not only the synthesis document. The Kind column uses: derive (decomposition),
      satisfy, depends. Give a rationale (its own column) on the business-requirement→goal
      links, including constraint/decision BRs that yield no leaf goal; the other tables use
      Kind only. All linking lives HERE, never in the model prose.
    requires:
      - business-requirements
      - goal-model
      - responsibility-model
      - operation-model
      - requirements-document
