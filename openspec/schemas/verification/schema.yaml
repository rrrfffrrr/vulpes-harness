name: verification
version: 1
metadata:
  version: "1.2.1"   # harness release version - templates' schema-version frontmatter mirrors this; bump together
description: "Acceptance & verification design - no implementation/apply step. The thin verification layer over the requirements and detail-design changes: it owns ONLY what those designs cannot derive. Methodology: ISTQB test-basis vocabulary (the detail designs ARE the test basis; per-contract test cases are derived from them with ISO/IEC/IEEE 29119-4 techniques and are NOT written here), ISO/IEC/IEEE 29119-3:2021 dynamic-level documentation types (test data requirements, test environment requirements), Specification by Example (Adzic) with Gherkin scenarios for cross-layer acceptance journeys, and BABOK v3 10.1 acceptance criteria (owned by the requirements operation-model, realized here). Traceability closes the loop: every acceptance criterion is exercised by a scenario or listed as a gap."
# Authoring principles (all artifacts):
#  - THIN BY DESIGN. This schema owns scenario SELECTION and environment/data needs -
#    nothing that a detail-design contract already states. It never restates endpoints,
#    screens, stores, or validation rules, and never enumerates derived test cases
#    (per-field validation, per-status response checks): those are generated from the
#    contracts with 29119-4 techniques at build time. A per-contract test case found here
#    should be deleted, not maintained.
#  - Scenarios are CROSS-LAYER journeys. The requirements operation-model scenarios stay
#    system-agnostic (they reference goals); scenarios here are system-concrete - each
#    realizes one or more acceptance criteria from the operation-model and names the
#    design surfaces it crosses (endpoints by METHOD+path, screens, jobs, stores) by
#    reference, never by restating their contracts.
#  - Gherkin form (Given/When/Then), 3-5 steps per scenario; one scenario proves one
#    behavior. Concrete example values over abstract descriptions (Specification by
#    Example).
#  - Environment and data requirements state WHAT is needed (data sets, states, stubs,
#    device coverage), never how to provision it - provisioning is an ops concern.
#  - State each fact once: the test basis is declared in overview; scenarios reference
#    it; all linking lives in traceability.
#  - Prose follows openspec/rules/writing.md (reader-first): semantic line breaks, plain
#    language, front-loaded scannable structure, one term per concept, searchable headings
#    and verbatim literals, ISO 8601 dates.
#  - Structure follows openspec/rules/structure.md: boundary declaration, role separation,
#    split on growth, scoped naming, index hubs.
artifacts:
  - id: overview
    generates: overview.md
    description: >-
      The entry point. The test-basis declaration (which changes/documents verification
      builds on), the operations in scope, what is deliberately out of scope, and the
      reader map.
    template: overview.md
    instruction: |
      Frame the verification design. Cover: the TEST BASIS (ISTQB sense) - the exact
      changes and artifacts this verification builds on (the requirements
      operation-model with its acceptance criteria, and each detail-design change
      present: backend, frontend, persistence, game-ui, ml), by change name; the SCOPE -
      which requirements operations this verification covers; OUT OF SCOPE stated
      explicitly - derived per-contract test cases (generated from the contracts, not
      designed here) and performance/SLO verification (architecture crosscutting
      owns the targets); and the READER MAP (QA / engineers / product - what each
      reads first).
      Reference changes and artifacts by name; do not restate their content.
    requires: []

  - id: scenarios
    generates: scenarios/index.md
    description: >-
      The cross-layer acceptance scenarios in Gherkin, grouped by requirements
      operation: each realizes named acceptance criteria and lists the design
      surfaces it crosses by reference. scenarios/index.md is the domain index;
      each domain's scenarios/<domain>.md holds its scenarios.
    template: scenarios.md
    instruction: |
      Write the acceptance scenarios, grouped by requirements operation. Per
      SCENARIO: the acceptance CRITERIA it realizes (operation name + criterion, from
      the requirements operation-model); the Gherkin steps (Given/When/Then, 3-5
      steps, concrete example values per Specification by Example); and SURFACES -
      the design surfaces the journey crosses, by reference (backend endpoints by
      METHOD+path, screens and flows by name, jobs by name, stores by name) - never
      restate their contracts. Prefer journeys that cross layers (UI -> API -> store
      -> event/job) - single-contract behavior is covered by derived tests, not
      here. Include the failure journeys that acceptance depends on (e.g. the error
      copy a rejected action shows, per the frontend error mapping) - one scenario
      proves one behavior.
      Every acceptance criterion in scope is realized by at least one scenario or
      recorded as a gap in traceability.
      scenarios/index.md is the INDEX only (domain -> file -> one-line scope); every
      scenario lives in a per-domain file scenarios/<domain>.md - domains mirror the
      requirements scenarios domains.
    requires:
      - overview

  - id: environment
    generates: environment.md
    description: >-
      ISO/IEC/IEEE 29119-3 test data requirements and test environment requirements:
      the data sets/states scenarios need and the environment (components, stores,
      stubs, device coverage) they run against.
    template: environment.md
    instruction: |
      State what the scenarios need to run, in two parts (29119-3 documentation
      types, merged). TEST DATA REQUIREMENTS, one fact per column (rules/writing.md
      Tables): per scenario group, the data set (records that must exist), the
      state (condition those records are in), and resetting (how runs stay
      isolated); plus how personal data is handled (honoring the persistence
      retention/PII classes when a persistence change exists - synthetic data over
      copied production data).
      TEST ENVIRONMENT REQUIREMENTS: the components and stores that must be real,
      the external systems stubbed (payment providers, webhook receivers), the
      device/platform coverage the frontend or game-ui overview implies, and any
      clock/time control scenarios need (for jobs and retention).
      State WHAT is needed, never how to provision it.
    requires:
      - scenarios

  - id: traceability
    generates: traceability.md
    description: >-
      The linking matrix: acceptance criteria <-> scenarios <-> surfaces crossed <->
      environment needs. All cross-artifact linking lives here.
    template: traceability.md
    instruction: |
      Produce the bidirectional matrix linking: requirements operations and their
      acceptance criteria <-> the scenarios that realize them <-> the design surfaces
      each scenario crosses <-> the environment/data requirements it depends on. Draw
      names from the artifacts themselves.
      Include a GAPS section: acceptance criteria no scenario realizes, scenarios
      realizing no criterion, and design surfaces in the test basis that no scenario
      crosses (untested seams). All linking lives HERE - never in artifact prose
      beyond the single inline criteria reference each scenario carries.
    requires:
      - scenarios
      - environment
